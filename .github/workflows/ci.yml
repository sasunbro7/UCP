name: Build, test, and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  c89:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile with C89 warnings
        run: make clean all

      - name: Run scripted gameplay tests
        run: make test

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind

      - name: Check winning and losing runs for leaks
        run: |
          printf '%s' 'dudddwwwwwddwwwddddddddddddaaaaaddddd' |
            valgrind --leak-check=full --show-leak-kinds=all \
              --errors-for-leak-kinds=all --error-exitcode=99 \
              ./dungeon map.txt >/dev/null
          printf '%s' 'dddwwwwwaaa' |
            valgrind --leak-check=full --show-leak-kinds=all \
              --errors-for-leak-kinds=all --error-exitcode=99 \
              ./dungeon map.txt >/dev/null

      - name: Package clean assignment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: UCP_Assignment
          path: |
            README.md
            main.c
            game.c
            game.h
            map.c
            map.h
            linkedList.c
            linkedList.h
            terminal.c
            terminal.h
            color.c
            color.h
            newSleep.c
            newSleep.h
            makefile
            map.txt
            tests.sh
          if-no-files-found: error
          retention-days: 90
